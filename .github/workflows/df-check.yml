name: Disk Usage Report

# Manual trigger only — click "Run workflow" in the Actions tab to run it.
on:
  schedule:
    - cron: '02 * * * *'   # Every hour
  workflow_dispatch:      # Optional manual trigger

jobs:
  df-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run df -h on server 1 and collect output
        run: |
          {
            echo "===================================="
            echo "Server: ${{ secrets.SSH_HOST1 }}"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "===================================="
            sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST1 }}" "df -h"
            echo ""
          } >> df_report.txt

      - name: Run df -h on server 2 and collect output
        run: |
          {
            echo "===================================="
            echo "Server: ${{ secrets.SSH_HOST2 }}"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "===================================="
            sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST2 }}" "df -h"
            echo ""
          } >> df_report.txt

      - name: Show collated report in logs
        run: cat df_report.txt

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: df-report
          path: df_report.txt

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          BODY_TEXT=$(jq -Rs . < df_report.txt)
          ATTACHMENT_B64=$(base64 -w 0 df_report.txt)

          PAYLOAD=$(jq -n \
            --arg from "$MAIL_FROM" \
            --arg to "$MAIL_TO" \
            --arg subject "Disk Usage Report - ${{ github.run_id }}" \
            --argjson text "$BODY_TEXT" \
            --arg content "$ATTACHMENT_B64" \
            '{from: $from, to: [$to], subject: $subject, text: $text, attachments: [{filename: "df_report.txt", content: $content}]}')

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Resend API response (HTTP $HTTP_STATUS):"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Email send failed."
            exit 1
          fi
